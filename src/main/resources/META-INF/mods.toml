modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.20.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="refinedstorage"
mandatory=false
versionRange="[1.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="toms_storage"
mandatory=false
versionRange="[1.7,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=false
versionRange="[15.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="beyonddimensions"
mandatory=false
versionRange="[0.7,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="itemborders"
mandatory=true
